name: Format sources

on:
  push:
    branches:
      - command-deck
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uFBT
        uses: flipperdevices/flipperzero-ufbt-action@v0.1.3
        with:
          sdk-channel: release

      - name: Format sources
        uses: flipperdevices/flipperzero-ufbt-action@v0.1.3
        with:
          skip-setup: true
          task: format

      - name: Show formatting patch
        run: git diff -- '*.c' '*.h'

      - name: Upload formatted sources
        uses: actions/upload-artifact@v7
        with:
          name: sdk-formatted-sources
          path: |
            *.c
            *.h
